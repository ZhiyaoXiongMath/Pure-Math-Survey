implemented_changes:
- Schema 3 uses sources, conventions, Markdown units with JSON frontmatter, grouped
  routes and a short generated index. Init creates no output or required snapshot,
  overview, discovery, coverage, review or paired-proof containers.
- Stable N-/S- IDs identify units and sources. Kind, role and nullable importance
  are independent. definition_refs adds actual concept closure to exports and
  prepares exact canonical bytes; source version and locator remain available.
- Routes retain jointly required nodes within each premise set, alternatives
  between sets, separate additional inputs, mapping and source/status facts.
  Missing references and cycles are mechanical diagnostics. Unresolved routes
  stay explicit; independent principal results need no invented route.
- Methods may have a formal canonical interface. A method without one remains
  a method description and cannot supply an asserted route conclusion or full
  principal statement. Route exports label nonformal method premises explicitly.
- Output plans read the live KB. Prepare records automatic input hashes, derives
  canonical/conventions/bibliography/route fragments and bounded materials, and
  preserves author main text, graph layout, style and outline. Refresh saves old
  output inputs and build bytes in content-addressed preparation history.
- Standalone unit export includes recursive definitions, shared notation and
  source locators with a compilable TeX entry. It refuses existing destinations,
  project-contained exports and symlink destinations before writing.
- Supplied retained-original hashes remain enforced; actual original-byte aliases
  are excluded from authoring exports and refused by output packaging. Legacy
  schemas and old containers are rejected without automatic string-only migration.
- Build, output package and independent rebuild now use the same schema-3 input
  hash identity. run.json records actual build state and total pages; unavailable
  body-page, time and token measurements remain null.
- Installed docs, metadata, active resource validation, verifier and three-platform
  CI reflect the intermediate dev.3 candidate. Final v22 layout is still PR04 work.
