interface:
  display_name: "Pure Math Survey"
  short_description: "Knowledge-first four-mode mathematical exposition"
  default_prompt: "Use $pure-math-survey 2.1.0-rc2 (knowledge schema 2.0.0; output/review schema 2.2.0). Recover the requested mathematical scope; inspect or initialize a native knowledge project; discover and actually read primary sources; maintain readable exact nodes, typed dependencies, coverage and honestly scoped evidence; freeze an immutable snapshot. For knowledge-only or update-only tasks generate no manuscript. For an unspecified requested output default to minimal plus integrated and produce no extra profiles. Minimal, thematic, lecture and paper share exact canonical statements but have distinct reading and proof obligations. Minimal has exactly Main Results, Key Mathematical Ingredients, and Connecting the Ingredients. Paper defaults to DRAFT_UNVERIFIED and requires actual authorized-original-contribution, prior-art and complete-proof reviews before formal release. Calibrate reader capabilities, distinguish project overview from this output outline, and alternate short prose with substantive mathematical displays without line-count tricks. Write only from the selected snapshot, review each manuscript separately, compile, render and inspect every actual PDF page, then run release checks and package rebuildable files. Self-review is author_reread, not independent review. Keep only explicit max_pages as a hard limit, and do not create a Research Studio bridge or native Studio project."

# vNext: follow the installed four-profile and versioned review contracts.
# Paper is draft-only until actual authorized novelty and complete-proof review.
