interface:
  display_name: "Pure Math Survey"
  short_description: "Compact, source-checked mathematical surveys"
  default_prompt: "Use $pure-math-survey. Identify the organizing problem, check current primary sources, state actual main conclusions early, and deliver a compact rebuildable TeX/PDF survey. Default to Part V concise; an explicitly requested suite uses I–V concise. Preserve core statements and key lemmas in the body, with explicit proof or sourced-outline boundaries. Concise compresses proof interiors; standard develops the same mathematical spine. Put material hypotheses, criteria and conclusion formulas in statements, permitting necessary nearby definitions. Read the whole body for recoverable results and proof dependencies; a compiled example is not automatically a writing model. Preserve all necessary hypotheses and mark fresh preprint claims. Treat default length thresholds as non-blocking reread guidance, enforce only explicit user page limits, and follow the templates and Part V guide; sample use is optional and purpose-specific."
