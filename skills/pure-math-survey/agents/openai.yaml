interface:
  display_name: "Pure Math Survey"
  short_description: "Knowledge-first mathematical surveys and lectures"
  default_prompt: "Use $pure-math-survey 2.0.3 (data schema 2.0.0). Recover the requested mathematical scope; inspect or initialize a native knowledge project; discover and actually read primary sources; maintain readable exact nodes, typed dependencies, coverage and honestly scoped evidence; freeze an immutable snapshot. For knowledge-only or update-only tasks generate no manuscript. For an unspecified requested output default to minimal plus integrated and produce no extra profiles. Minimal, thematic and lecture use exact shared canonical statements but different selection and explanation. Write only from the selected snapshot, review each manuscript separately, compile, render and inspect every actual PDF page, then run release checks and package rebuildable files. Self-review is author_reread, not independent review. Keep only explicit max_pages as a hard limit, and do not create a Research Studio bridge or native Studio project."
