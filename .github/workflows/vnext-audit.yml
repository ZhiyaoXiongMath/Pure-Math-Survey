name: Historical vNext manual audit

on:
  # Historical revisions may still be audited explicitly. Active development
  # is checked by rc2-audit.yml and the candidate matrix in ci.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Preserve exact source revision
        run: |
          mkdir -p "$RUNNER_TEMP/vnext-evidence"
          git archive --format=zip HEAD > "$RUNNER_TEMP/vnext-evidence/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/vnext-evidence/revision.txt"
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Baseline and development regression tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/vnext-evidence/tests.log"
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vnext-audit-${{ github.sha }}
          path: ${{ runner.temp }}/vnext-evidence/
          if-no-files-found: error
          retention-days: 30
